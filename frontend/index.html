<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SCZ Segura Predictiva</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/incidentes.css">
    <style>
        #mapa {
            height: 400px;
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid #004d00;
        }
        .btn-ubicacion {
            background-color: #004d00;
            color: white;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: auto;
        }
        .preview-imagenes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .preview-imagenes img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #004d00;
        }
        .coordenadas {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .cargando {
            text-align: center;
            padding: 20px;
            color: #004d00;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>SCZ Segura Predictiva</h1>
        <p>Santa Cruz - Bolivia</p>
    </div>
    
    <div class="container">
        <div id="message" class="message"></div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('registro')">Registro</div>
            <div class="tab" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('reportar')">Reportar Incidente</div>
            <div class="tab" onclick="switchTab('incidentes')">Ver Incidentes</div>
            <div class="tab" onclick="switchTab('recuperar')">Recuperar Contraseña</div>
        </div>
        
        <div id="registro" class="tab-content active">
            <div class="form-container">
                <h2>Registro de Usuario</h2>
                <form id="registroForm">
                    <div class="form-group">
                        <label>CI:</label>
                        <input type="text" id="reg_ci" required>
                    </div>
                    <div class="form-group">
                        <label>Nombre:</label>
                        <input type="text" id="reg_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido:</label>
                        <input type="text" id="reg_apellido" required>
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="reg_email" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono:</label>
                        <input type="text" id="reg_telefono" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña:</label>
                        <input type="password" id="reg_contrasena" required>
                    </div>
                    <button type="submit">Registrarse</button>
                </form>
            </div>
            
            <div class="form-container">
                <h2>Verificar Código</h2>
                <form id="verificarForm">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="ver_email" required>
                    </div>
                    <div class="form-group">
                        <label>Código de Verificación:</label>
                        <input type="text" id="ver_codigo" required>
                    </div>
                    <button type="submit">Verificar Cuenta</button>
                </form>
            </div>
        </div>
        
        <div id="login" class="tab-content">
            <div class="form-container">
                <h2>Iniciar Sesión</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="login_email" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña:</label>
                        <input type="password" id="login_contrasena" required>
                    </div>
                    <button type="submit">Ingresar</button>
                </form>
            </div>
        </div>
        
        <div id="reportar" class="tab-content">
            <div class="form-container">
                <h2>Reportar Incidente de Seguridad</h2>
                <form id="reporteForm">
                    <div class="form-group">
                        <label>Tipo de Delito:</label>
                        <select id="tipo_delito" required>
                            <option value="robo">Robo</option>
                            <option value="asalto">Asalto</option>
                            <option value="sospechoso">Persona Sospechosa</option>
                            <option value="violencia">Violencia</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descripción:</label>
                        <textarea id="descripcion" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Dirección:</label>
                        <input type="text" id="direccion" required>
                    </div>
                    <div class="form-group">
                        <label>Ubicación Actual:</label>
                        <button type="button" class="btn-ubicacion" onclick="obtenerUbicacion()">
                            Usar mi ubicación actual
                        </button>
                        <div class="coordenadas" id="coordenadas_info"></div>
                    </div>
                    <div class="form-group">
                        <label>Latitud:</label>
                        <input type="text" id="latitud" readonly placeholder="Se obtendrá automáticamente">
                    </div>
                    <div class="form-group">
                        <label>Longitud:</label>
                        <input type="text" id="longitud" readonly placeholder="Se obtendrá automáticamente">
                    </div>
                    <div class="form-group">
                        <label>Fotos del Incidente:</label>
                        <input type="file" id="imagenes" accept="image/*" multiple>
                        <div id="preview_imagenes" class="preview-imagenes"></div>
                    </div>
                    <button type="submit">Reportar Incidente</button>
                </form>
                
                <div id="mapa"></div>
            </div>
        </div>
        
        <div id="incidentes" class="tab-content">
            <div class="form-container">
                <h2>Incidentes Reportados</h2>
                <div id="incidentesLista"></div>
            </div>
        </div>
        
        <div id="recuperar" class="tab-content">
            <div class="form-container">
                <h2>Solicitar Recuperación</h2>
                <form id="solicitarRecuperacionForm">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="rec_email" required>
                    </div>
                    <button type="submit">Enviar Código</button>
                </form>
            </div>
            
            <div class="form-container">
                <h2>Cambiar Contraseña</h2>
                <form id="cambiarContrasenaForm">
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="cambio_email" required>
                    </div>
                    <div class="form-group">
                        <label>Código de Recuperación:</label>
                        <input type="text" id="cambio_codigo" required>
                    </div>
                    <div class="form-group">
                        <label>Nueva Contraseña:</label>
                        <input type="password" id="cambio_contrasena" required>
                    </div>
                    <button type="submit">Cambiar Contraseña</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDummyKey&callback=initMap&libraries=geometry&v=weekly" async defer></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/incidentes.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
    let mapa;
    let marcador;
    
    function initMap() {
        const santaCruz = { lat: -17.783333, lng: -63.183333 };
        mapa = new google.maps.Map(document.getElementById("mapa"), {
            zoom: 13,
            center: santaCruz,
        });
        
        mapa.addListener("click", function(event) {
            const lat = event.latLng.lat();
            const lng = event.latLng.lng();
            actualizarCoordenadas(lat, lng);
        });
    }
    
    function actualizarCoordenadas(lat, lng) {
        document.getElementById('latitud').value = lat.toFixed(8);
        document.getElementById('longitud').value = lng.toFixed(8);
        document.getElementById('coordenadas_info').innerHTML = `Ubicación seleccionada: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        
        if (marcador) {
            marcador.setMap(null);
        }
        marcador = new google.maps.Marker({
            position: { lat: lat, lng: lng },
            map: mapa,
            title: "Ubicación del incidente"
        });
        mapa.setCenter({ lat: lat, lng: lng });
    }
    
    function obtenerUbicacion() {
        if (!navigator.geolocation) {
            showMessage("Geolocalización no soportada", "error");
            return;
        }
        
        showMessage("Obteniendo ubicación...", "success");
        
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                actualizarCoordenadas(lat, lng);
                showMessage("Ubicación obtenida correctamente", "success");
            },
            function(error) {
                let mensaje = "Error al obtener ubicación";
                switch(error.code) {
                    case 1: mensaje = "Permiso denegado. Activa la ubicación"; break;
                    case 2: mensaje = "Ubicación no disponible"; break;
                    case 3: mensaje = "Tiempo de espera agotado"; break;
                }
                showMessage(mensaje, "error");
            }
        );
    }
    
    document.getElementById('imagenes').addEventListener('change', function(e) {
        const preview = document.getElementById('preview_imagenes');
        preview.innerHTML = '';
        const files = e.target.files;
        
        for (let i = 0; i < files.length; i++) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.createElement('img');
                img.src = event.target.result;
                preview.appendChild(img);
            };
            reader.readAsDataURL(files[i]);
        }
    });
    
    window.initMap = initMap;
    </script>
</body>
</html>
